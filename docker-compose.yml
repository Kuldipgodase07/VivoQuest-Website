version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vivoquest_dev
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/vivoquest_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=vivoquest_production_jwt_secret_key_2026
      - HMAC_SECRET=vivoquest_phone_hmac_secret_2026
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./vivoquest-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/v1
    depends_on:
      - backend

volumes:
  mongodata:
  redisdata:
