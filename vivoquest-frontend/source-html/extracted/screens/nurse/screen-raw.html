  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

        <\/div>\n      <\/div>\n    <\/div>\n    <\/sc-if>\n\n    <!-- ============ PATIENTS ============ -->\n    <sc-if value=\"{{ s.patients }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"page\">\n      <div class=\"row\" style=\"flex-wrap:wrap;margin-bottom:18px\"><div style=\"position:relative;flex:1 1 280px;max-width:420px\"><label for=\"pq\" style=\"position:absolute;width:1px;height:1px;overflow:hidden\">Search patients<\/label><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" style=\"position:absolute;left:16px;top:17px;color:#667085\"><path d=\"M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.5-4.5\"><\/path><\/svg><input id=\"pq\" class=\"input\" style=\"padding-left:44px\" placeholder=\"Search by name or area\" value=\"{{ pt.q }}\" sc-camel-on-change=\"{{ a.onQ }}\"><\/div><div class=\"seg\"><sc-for list=\"{{ pt.filters }}\" as=\"f\" hint-placeholder-count=\"3\"><button class=\"{{ f.cls }}\" sc-camel-on-click=\"{{ f.tap }}\">{{ f.label }}<\/button><\/sc-for><\/div><\/div>\n      <div class=\"card\" style=\"padding:8px 22px\">\n        <sc-if value=\"{{ pt.empty }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"sub\" style=\"padding:36px 0;text-align:center\">No patients match. Try a different name or filter.<\/div><\/sc-if>\n        <sc-for list=\"{{ pt.rows }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <button class=\"li hov\" style=\"padding:16px 8px;border-radius:14px\" sc-camel-on-click=\"{{ p.tap }}\"><div class=\"avatar\" style=\"width:48px;height:48px\">{{ p.ini }}<\/div><div style=\"flex:1;min-width:0\"><div style=\"font-weight:800;font-size:16px\">{{ p.name }}<\/div><div class=\"sub\" style=\"font-size:13px\">{{ p.age }} · {{ p.area }}<\/div><\/div><span class=\"badge {{ p.cls }}\">{{ p.label }}<\/span><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" style=\"color:#9A93B5\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg><\/button>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n    <\/sc-if>\n\n    <!-- ============ PATIENT DETAIL ============ -->\n    <sc-if value=\"{{ s.patient }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"page cols\">\n      <div class=\"col\" style=\"gap:24px\">\n        <div class=\"card\">\n          <button class=\"btn g sm\" style=\"margin-bottom:18px\" sc-camel-on-click=\"{{ a.toPatients }}\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg>All patients<\/button>\n          <div class=\"row\" style=\"flex-wrap:wrap;gap:16px\"><div class=\"avatar\" style=\"width:68px;height:68px;font-size:22px\">{{ sp.ini }}<\/div><div style=\"flex:1;min-width:200px\"><div style=\"font-size:26px;font-weight:800;letter-spacing:-.01em\">{{ sp.name }}<\/div><div class=\"sub\">{{ sp.age }} · {{ sp.addr }}<\/div><\/div><span class=\"badge {{ sp.cls }}\">{{ sp.label }}<\/span><\/div>\n          <div style=\"margin-top:20px;padding:16px;border-radius:16px;background:#F7F5FF\"><div class=\"eyebrow\" style=\"color:#4520B8\">CONDITION<\/div><div style=\"font-weight:700;font-size:16px;margin-top:4px\">{{ sp.cond }}<\/div><\/div>\n          <div class=\"cols2\" style=\"margin-top:16px;gap:16px\"><div style=\"padding:16px;border-radius:16px;background:#FBF0DC\"><div class=\"eyebrow\" style=\"color:#8A4F0B\">ALLERGY<\/div><div style=\"font-weight:800;font-size:16px;margin-top:4px;color:#5E3607\">{{ sp.allergy }}<\/div><\/div><div style=\"padding:16px;border-radius:16px;background:#E3F4EC\"><div class=\"eyebrow\" style=\"color:#0F6B49\">LAST VITALS · {{ sp.vitWhen }}<\/div><div style=\"font-weight:800;font-size:15px;margin-top:4px;color:#0B4F37\">{{ sp.vit }}<\/div><\/div><\/div>\n          <p class=\"sub\" style=\"margin:16px 0 0;font-size:15px;color:#33304F\">{{ sp.notes }}<\/p>\n        <\/div>\n        <div class=\"card\"><h2 class=\"h2\" style=\"margin-bottom:6px\">Today's plan<\/h2><sc-for list=\"{{ sp.plan }}\" as=\"x\" hint-placeholder-count=\"3\"><div class=\"li\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" style=\"color:#4520B8\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\/path><\/svg><span style=\"font-weight:600\">{{ x.t }}<\/span><\/div><\/sc-for><\/div>\n      <\/div>\n      <div class=\"card\"><h2 class=\"h2\" style=\"margin-bottom:14px\">Actions<\/h2><div class=\"col\" style=\"gap:10px\">\n        <sc-if value=\"{{ sp.canStart }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn p w\" sc-camel-on-click=\"{{ sp.prep }}\">Prepare and start visit<\/button><\/sc-if>\n        <button class=\"btn g w\" sc-camel-on-click=\"{{ a.toEsc }}\">Escalate to clinician<\/button>\n        <button class=\"btn g w\" sc-camel-on-click=\"{{ a.toMsgs }}\">Message the care team<\/button><\/div><\/div>\n    <\/div>\n    <\/sc-if>\n\n    <!-- ============ VISIT WIZARD ============ -->\n    <sc-if value=\"{{ s.visit }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"page cols2\" style=\"grid-template-columns:260px minmax(0,1fr)\">\n      <div class=\"card\" style=\"padding:16px\"><div class=\"row\" style=\"padding:6px 8px 14px\"><div class=\"avatar\" style=\"width:44px;height:44px\">{{ sp.ini }}<\/div><div><div style=\"font-weight:800\">{{ sp.name }}<\/div><div class=\"sub\" style=\"font-size:12px\">{{ sp.time }} visit<\/div><\/div><\/div>\n        <sc-for list=\"{{ steps }}\" as=\"x\" hint-placeholder-count=\"5\"><div class=\"step {{ x.cls }}\"><b>{{ x.num }}<\/b><span>{{ x.label }}<\/span><\/div><\/sc-for>\n        <button class=\"btn g sm w\" style=\"margin-top:14px\" sc-camel-on-click=\"{{ a.saveDraft }}\">Save draft<\/button><\/div>\n      <div class=\"card\">\n        <sc-if value=\"{{ vs0 }}\" hint-placeholder-val=\"{{ true }}\">\n          <h2 class=\"h2\" style=\"font-size:24px;margin-bottom:4px\">Pack your supplies<\/h2><div class=\"sub\" style=\"margin-bottom:16px\">{{ prep.count }}<\/div>\n          <sc-for list=\"{{ prep.items }}\" as=\"x\" hint-placeholder-count=\"5\"><button class=\"li hov\" style=\"padding:14px 8px;border-radius:12px\" sc-camel-on-click=\"{{ x.tap }}\"><span class=\"chk {{ x.cls }}\"><sc-if value=\"{{ x.on }}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" style=\"width:16px;height:16px;stroke-width:3\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\/path><\/svg><\/sc-if><\/span><span style=\"font-weight:700;font-size:16px\">{{ x.label }}<\/span><\/button><\/sc-for>\n        <\/sc-if>\n        <sc-if value=\"{{ vs1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 class=\"h2\" style=\"font-size:24px;margin-bottom:4px\">Record vitals<\/h2><div class=\"sub\" style=\"margin-bottom:18px\">Numbers outside the safe range will be flagged for the clinician.<\/div>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px\">\n            <div><label class=\"lbl\" for=\"sys\">Systolic (mmHg)<\/label><input id=\"sys\" class=\"input {{ vt.sysCls }}\" inputmode=\"numeric\" maxlength=\"3\" value=\"{{ vt.sys }}\" sc-camel-on-change=\"{{ a.onSys }}\"><\/div>\n            <div><label class=\"lbl\" for=\"dia\">Diastolic (mmHg)<\/label><input id=\"dia\" class=\"input {{ vt.diaCls }}\" inputmode=\"numeric\" maxlength=\"3\" value=\"{{ vt.dia }}\" sc-camel-on-change=\"{{ a.onDia }}\"><\/div>\n            <div><label class=\"lbl\" for=\"pul\">Pulse (per min)<\/label><input id=\"pul\" class=\"input {{ vt.pulCls }}\" inputmode=\"numeric\" maxlength=\"3\" value=\"{{ vt.pulse }}\" sc-camel-on-change=\"{{ a.onPulse }}\"><\/div>\n            <div><label class=\"lbl\" for=\"spo\">SpO₂ (%)<\/label><input id=\"spo\" class=\"input {{ vt.spoCls }}\" inputmode=\"numeric\" maxlength=\"3\" value=\"{{ vt.spo2 }}\" sc-camel-on-change=\"{{ a.onSpo }}\"><\/div>\n            <div><label class=\"lbl\" for=\"tmp\">Temperature (°C)<\/label><input id=\"tmp\" class=\"input {{ vt.tmpCls }}\" inputmode=\"decimal\" maxlength=\"4\" value=\"{{ vt.temp }}\" sc-camel-on-change=\"{{ a.onTemp }}\"><\/div>\n          <\/div>\n          <sc-if value=\"{{ vt.anyErr }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"err-t\">Check the highlighted numbers. They look outside what a device can read.<\/div><\/sc-if>\n          <div style=\"margin-top:20px\"><span class=\"lbl\">Pain score (0 to 10)<\/span><div class=\"row\" style=\"flex-wrap:wrap;gap:8px\"><sc-for list=\"{{ vt.pain }}\" as=\"x\" hint-placeholder-count=\"11\"><button class=\"chip {{ x.cls }}\" style=\"min-width:48px;justify-content:center;padding:0 12px\" sc-camel-on-click=\"{{ x.tap }}\">{{ x.label }}<\/button><\/sc-for><\/div><\/div>\n          <sc-if value=\"{{ vt.flag }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"row\" style=\"margin-top:20px;padding:16px;border-radius:16px;background:#FCE8EA;color:#7D1824;align-items:flex-start\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 3 2 20h20zM12 10v4M12 17h.01\"><\/path><\/svg><div style=\"flex:1\"><div style=\"font-weight:800\">Outside thresholds<\/div><div style=\"font-weight:600;font-size:14px;margin:2px 0 10px\">{{ vt.flagText }}<\/div><button class=\"btn r sm\" sc-camel-on-click=\"{{ a.toEsc }}\">Escalate to clinician<\/button><\/div><\/div><\/sc-if>\n        <\/sc-if>\n        <sc-if value=\"{{ vs2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 class=\"h2\" style=\"font-size:24px;margin-bottom:4px\">Visit checklist<\/h2><div class=\"sub\" style=\"margin-bottom:16px\">{{ ck.count }} complete · items marked Required must be done<\/div>\n          <sc-for list=\"{{ ck.items }}\" as=\"x\" hint-placeholder-count=\"6\"><button class=\"li hov\" style=\"padding:14px 8px;border-radius:12px\" sc-camel-on-click=\"{{ x.tap }}\"><span class=\"chk {{ x.cls }}\"><sc-if value=\"{{ x.on }}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" style=\"width:16px;height:16px;stroke-width:3\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\/path><\/svg><\/sc-if><\/span><div style=\"flex:1\"><div style=\"font-weight:700;font-size:16px\">{{ x.label }}<\/div><div class=\"sub\" style=\"font-size:13px\">{{ x.meta }}<\/div><\/div><sc-if value=\"{{ x.req }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"badge b-info\">Required<\/span><\/sc-if><\/button><\/sc-for>\n          <sc-if value=\"{{ ck.err }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"err-t\">Complete the three required items to continue.<\/div><\/sc-if>\n        <\/sc-if>\n        <sc-if value=\"{{ vs3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 class=\"h2\" style=\"font-size:24px;margin-bottom:4px\">Document the visit<\/h2><div class=\"sub\" style=\"margin-bottom:18px\">Your note is shared with the clinician and family.<\/div>\n          <span class=\"lbl\">Wound condition<\/span><div class=\"row\" style=\"flex-wrap:wrap;gap:10px;margin-bottom:20px\"><sc-for list=\"{{ dc.cond }}\" as=\"x\" hint-placeholder-count=\"3\"><button class=\"chip {{ x.cls }}\" sc-camel-on-click=\"{{ x.tap }}\">{{ x.label }}<\/button><\/sc-for><\/div>\n          <label for=\"dn\" class=\"lbl\">Visit note<\/label><textarea id=\"dn\" class=\"ta\" placeholder=\"What did you see and do? At least 10 characters.\" sc-camel-on-change=\"{{ a.onNote }}\">{{ dc.note }}<\/textarea>\n          <sc-if value=\"{{ dc.noteErr }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"err-t\">Add a short note (at least 10 characters).<\/div><\/sc-if>\n          <button class=\"li hov\" style=\"margin-top:12px;padding:14px 8px;border-radius:12px;border:0\" sc-camel-on-click=\"{{ a.togEdu }}\"><span class=\"chk {{ dc.eduCls }}\"><sc-if value=\"{{ dc.edu }}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"ic sm\" sc-camel-view-box=\"0 0 24 24\" style=\"width:16px;height:16px;stroke-width:3\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\/path><\/svg><\/sc-if><\/span><span style=\"font-weight:700\">Warning signs explained to family<\/span><\/button>\n        <\/sc-if>\n        <sc-if value=\"{{ vs4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 class=\"h2\" style=\"font-size:24px;margin-bottom:16px\">Review and complete<\/h2>\n          <div class=\"li\"><span class=\"sub\" style=\"width:120px\">Vitals<\/span><span style=\"font-weight:700\">{{ fin.vit }}<\/span><\/div>\n          <div class=\"li\"><span class=\"sub\" style=\"width:120px\">Checklist<\/span><span style=\"font-weight:700\">{{ fin.ck }}<\/span><\/div>\n          <div class=\"li\"><span class=\"sub\" style=\"width:120px\">Wound<\/span><span style=\"font-weight:700\">{{ fin.cond }}<\/span><\/div>\n          <div class=\"li\"><span class=\"sub\" style=\"width:120px\">Note<\/span><span style=\"font-weight:700\">{{ fin.note }}<\/span><\/div>\n        <\/sc-if>\n        <div class=\"row\" style=\"margin-top:26px;justify-content:space-between\"><button class=\"btn g\" sc-camel-on-click=\"{{ a.vBack }}\">{{ backLabel }}<\/button><button class=\"btn p\" sc-camel-on-click=\"{{ a.vNext }}\">{{ nextLabel }}<\/button><\/div>\n      <\/div>\n    <\/div>\n    <\/sc-if>\n\n    <!-- ============ DONE ============ -->\n    <sc-if value=\"{{ s.done }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"page\" style=\"max-width:620px;margin:20px auto;text-align:center\">\n      <div class=\"card\" style=\"padding:40px\">\n        <div style=\"width:88px;height:88px;border-radius:50%;background:{{ dn.bg }};color:{{ dn.fg }};display:inline-flex;align-items:center;justify-content:center;animation:pop .4s ease both\"><svg class=\"ic lg\" sc-camel-view-box=\"0 0 24 24\" style=\"width:46px;height:46px\"><path d=\"{{ dn.icon }}\"><\/path><\/svg><\/div>\n        <h2 class=\"h2\" style=\"font-size:28px;margin:18px 0 8px\">{{ dn.title }}<\/h2><div><span class=\"badge {{ dn.cls }}\">{{ dn.badge }}<\/span><\/div>\n        <p class=\"sub\" style=\"font-size:16px;margin:14px 0 24px\">{{ dn.text }}<\/p>\n        <div class=\"row\" style=\"justify-content:center;flex-wrap:wrap\"><button class=\"btn p\" sc-camel-on-click=\"{{ a.leave }}\">Back to today<\/button><button class=\"btn g\" sc-camel-on-click=\"{{ n.sync }}\">Open sync centre<\/button><\/div>\n      <\/div>\n    <\/div>\n    <\/sc-if>\n\n    <!-- ============ ESCALATE ============ -->\n    <sc-if value=\"{{ s.esc }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"page\" style=\"max-width:760px\">\n      <sc-if value=\"{{ es.form }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"card\">\n        <div class=\"row\" style=\"margin-bottom:6px\"><div class=\"avatar\" style=\"width:48px;height:48px;background:#FCE8EA;color:#B42332\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 3 2 20h20zM12 10v4M12 17h.01\"><\/path><\/svg><\/div><div><h2 class=\"h2\" style=\"font-size:22px\">Escalate {{ sp.name }}<\/h2><div class=\"sub\">Dr. Joshi will be alerted.<\/div><\/div><\/div>\n        <div style=\"margin:20px 0 8px\"><span class=\"lbl\">Reason<\/span><div class=\"row\" style=\"flex-wrap:wrap;gap:10px\"><sc-for list=\"{{ es.reasons }}\" as=\"x\" hint-placeholder-count=\"5\"><button class=\"chip {{ x.cls }}\" sc-camel-on-click=\"{{ x.tap }}\">{{ x.label }}<\/button><\/sc-for><\/div><sc-if value=\"{{ es.err }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"err-t\">Choose a reason to continue.<\/div><\/sc-if><\/div>\n        <div style=\"margin:20px 0\"><span class=\"lbl\">How urgent?<\/span><div class=\"seg\"><sc-for list=\"{{ es.urg }}\" as=\"x\" hint-placeholder-count=\"2\"><button class=\"{{ x.cls }}\" sc-camel-on-click=\"{{ x.tap }}\">{{ x.label }}<\/button><\/sc-for><\/div><\/div>\n        <label for=\"en\" class=\"lbl\">Note (optional)<\/label><textarea id=\"en\" class=\"ta\" sc-camel-on-change=\"{{ a.onEscNote }}\">{{ es.note }}<\/textarea>\n        <div class=\"row\" style=\"margin-top:22px\"><button class=\"btn g\" style=\"flex:1\" sc-camel-on-click=\"{{ a.leave }}\">Cancel<\/button><button class=\"btn r\" style=\"flex:1\" sc-camel-on-click=\"{{ a.sendEsc }}\">Send to clinician<\/button><\/div>\n      <\/div>\n      <\/sc-if>\n      <sc-if value=\"{{ es.sent }}\" hint-placeholder-val=\"{{ false }
